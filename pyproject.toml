[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-qa-faiss"
version = "0.1.0"
description = "Document Q&A system using LangChain and FAISS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Monika Yadav" }
]
keywords = ["rag", "langchain", "faiss", "fastapi", "llm", "document-qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "faiss-cpu>=1.8.0",
  "pypdf>=4.2.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[project.scripts]
qa = "src.cli.main:app"

[project.urls]
Homepage = "https://github.com/monikayyy/Document-QA"
Repository = "https://github.com/monikayyy/Document-QA"
Issues = "https://github.com/monikayyy/Document-QA/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
src = "src"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
